[General]
; Polling rate dalam milidetik (16 ms ~= 60 Hz)
PollIntervalMs = 16

; Debounce benturan dalam milidetik agar tidak spam saat mobil bergesekan lama
CrashDebounceMs = 350

; Nama executable Sega Model 2 Emulator
ProcessNames = EMULATOR.EXE,EMULATOR_MULTICPU.EXE

[Hardware_Rumble]
; Aktifkan jika ingin menyalakan getaran di stik Xbox / XInput Gamepad langsung dari Python
EnableXInputRumble = true

; Aktifkan jika ingin mengirim trigger ke Arduino / ESP32 lewat USB Serial COM
EnableSerial = false
SerialPort = COM3
SerialBaud = 115200

; Aktifkan jika ingin menyiarkan event via UDP Socket (ke aplikasi / dashboard lain)
EnableUDP = true
UDPHost = 127.0.0.1
UDPPort = 9999
